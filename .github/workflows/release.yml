name: goreleaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source version is "dev"
        run: |
          grep -qx 'var version = "dev"' cmd/difi/main.go

      - name: Validate tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/validate-tag.sh "$RELEASE_TAG"
          grep -Fq "## [$RELEASE_TAG]" CHANGELOG.md

      - name: Check tag has not been released before
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG")
          case "$HTTP_CODE" in
            404) echo "OK: no existing release for $RELEASE_TAG" ;;
            200) echo "ERROR: release already exists; tags must never be reused"; exit 1 ;;
            *) echo "ERROR: GitHub returned HTTP $HTTP_CODE; cannot verify release uniqueness"; exit 1 ;;
          esac

  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  goreleaser:
    needs: [guard, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$RELEASE_TAG" '
            index($0, "## [" tag "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
